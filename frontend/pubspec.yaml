name: hostel_connect
description: "A professional Hostel Management application using Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  dio: ^5.9.2
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.2
  google_fonts: ^8.1.0
  lottie: ^3.3.3
  flutter_animate: ^4.2.0
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  permission_handler: ^12.0.3
  connectivity_plus: ^7.1.1
  url_launcher: ^6.1.10
  camera: ^0.10.0+5
  google_mlkit_face_detection: ^0.12.0
  image: ^4.0.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
